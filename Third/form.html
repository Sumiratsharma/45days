<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Example</title>
    </head>
<body>
    <!-- This is a simple form example with various input types -->
<form >  
<label for="username">Name:    </label>
<input type="text" id="username" name="username" placeholder="Enter your name" required>
<br><br>

<label for="email">Email:   </label>
<input type="email" id="email" name="email" placeholder="Enter your email" required>
<br><br>

<label for="Phone">Phone:   </label>
<input type="tel" id="Phone" name="Phone" placeholder="Enter your phone number" required>
<br><br>

<label for="age">Age:     </label>
<input type="number" id="age" name="age" placeholder="Enter your age" min="1" max="120" required>
<br><br>

<label for="DOB">Date of Birth:</label>
<input type="date" id="DOB" name="DOB" required>
<br><br>

<label for ="gender">Gender:</label>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>
<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label>
<br><br>

<label>Hobbies:</label>
        <input type="checkbox" name="hobbies" value="cricket"> Cricket
        <input type="checkbox" name="hobbies" value="music"> Music
        <input type="checkbox" name="hobbies" value="reading"> Reading
        <br><br>

<label for="password">Password:</label>
<input type="password" id="password" name="password" placeholder="Enter your password" required>
<br><br>

<label for="course">Course:</label>
<select id="course" name="course" required>
    <option value="">Select a course</option>
    <option value="CSE">Computer Science</option>
    <option value="Mechanical">Mechanical</option>
    <option value="Civil">Civil</option>
    <option value="ECE">Electronics and Communications</option>
</select>
<br><br>

<input type="submit" value="Submit">
<br><br>
<input type="reset" value="Clear Form">
</form>

 <h2>Audio & Video Example</h2>
    <!-- Audio Player -->
    <h3>Audio Player</h3>
    <audio controls muted loop>
        <!-- Primary source -->
        <source src="song.mp3" type="audio/mpeg">
        <!-- Fallback source -->
        <source src="song.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <br><br>

    <!-- Video Player -->
    <h3>Video Player</h3>
    <video width="500" controls poster="thumbnail.jpg">
        <source src="video.mp4" type="video/mp4">
        <source src="video.webm" type="video/webm">
        <!-- Fallback message if none of the sources work -->
        Your browser does not support the video tag.
    </video>

    <!-- Using media attribute for responsive video source (optional) -->
    <video controls width="500">
        <source src="large-video.mp4" media="(min-width: 800px)">
        
        <source src="small-video.mp4" media="(max-width: 799px)">
        Your browser does not support video.
    </video>



</body>

</html>
